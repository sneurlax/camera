name: camera_control
description: Cross-platform camera access for Dart and Flutter with no system dependencies for consumers.
version: 0.1.0
repository: https://github.com/ManyMath/camera_control
issue_tracker: https://github.com/ManyMath/camera_control/issues
topics:
  - camera
  - capture
  - video
  - ffi
  - cross-platform

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  web: ^1.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# Pub workspace member: shares the root lockfile.
resolution: workspace
