// The Android Gradle Plugin builds the native code with the Android NDK.

group = "com.manymath.camera_control_flutter"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.manymath.camera_control_flutter"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version declared in /android/app/build.gradle of the Flutter
    // project. Replace it with a version number if this plugin requires a
    // specific NDK version (e.g. ndkVersion "23.1.7779620").
    ndkVersion = android.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // Camera2/NDK requires API 24+.
        minSdk = 24
    }
}

// Build the camera_control Rust crate via cargokit. The crate lives at the repo
// root and is shared with the pure-Dart camera_control package; cargokit drops
// the per-ABI libcamera_control.so into jniLibs so it is packaged in the APK
// and resolvable by DynamicLibrary.open('libcamera_control.so').
apply from: "../cargokit/gradle/plugin.gradle"

cargokit {
    manifestDir = "../../../native/camera_control_native"
    libname = "camera_control"
}
