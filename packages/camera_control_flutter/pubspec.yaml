name: camera_control_flutter
description: >-
  Flutter integration for `camera_control`: cross-platform camera access with no
  system dependencies. Builds the native library automatically via cargokit.
version: 0.1.0
publish_to: none
repository: https://github.com/ManyMath/camera_control
issue_tracker: https://github.com/ManyMath/camera_control/issues
topics:
  - camera
  - capture
  - video
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  camera_control:
    path: ../camera_control

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
