name: camera_control_workspace
publish_to: none

# Dart pub workspace root. Member packages set `resolution: workspace` and
# share a single lockfile. Melos drives multi-package tooling on top of this.
environment:
  sdk: ^3.5.0

workspace:
  - packages/camera_control
  - packages/camera_control_flutter
  - packages/camera_control_flutter/example

dev_dependencies:
  melos: ^6.0.0

# Melos 7 reads its configuration from here (the pub-workspace root). Scripts
# mirror CI and use the right tool per package (dart vs flutter).
melos:
  name: camera_control
  scripts:
    analyze:
      description: Analyze all packages.
      run: dart analyze packages/camera_control && flutter analyze packages/camera_control_flutter
    format:
      description: Check Dart formatting.
      run: >-
        dart format --output none --set-exit-if-changed
        packages/camera_control packages/camera_control_flutter/lib packages/camera_control_flutter/example/lib
    format:fix:
      description: Apply Dart formatting.
      run: >-
        dart format
        packages/camera_control packages/camera_control_flutter/lib packages/camera_control_flutter/example/lib
    test:
      description: Run Dart and Flutter tests.
      run: dart test packages/camera_control && flutter test packages/camera_control_flutter/test
    native:build:
      description: Build the camera_control_native shared library (for CLI/dev use).
      run: cargo build --manifest-path native/camera_control_native/Cargo.toml
    native:test:
      description: Run the Rust crate tests.
      run: cargo test --manifest-path native/camera_control_native/Cargo.toml
